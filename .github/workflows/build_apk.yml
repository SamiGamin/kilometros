name: Compilar, Firmar y Publicar Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código completo y tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trae todos los tags remotos para comparar

      - name: 2. Verificar si es una versión nueva
        id: check_version
        run: |
          # Extraer el versionName de app/build.gradle.kts
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG_NAME="v$VERSION"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Comprobar si el tag ya existe en el repositorio
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "El tag $TAG_NAME ya existe. No es necesario crear un nuevo release."
            echo "is_new_version=false" >> $GITHUB_OUTPUT
          else
            echo "¡Nueva versión detectada ($TAG_NAME)! Procediendo a compilar y publicar."
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          fi

      - name: 3. Configurar Java JDK 17
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Gradle y Cache
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Permisos a gradlew
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        run: chmod +x gradlew

      - name: 6. Restaurar archivos desde Secrets
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GS_B64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > app/release.keystore

      - name: 6.1 Validar integridad
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore app/release.keystore -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"

      - name: 7. Compilar y Firmar APK (Release)
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_nil' || github.event_name == 'workflow_dispatch' || steps.check_version.outputs.is_new_version == 'true'
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 8. Crear Tag y GitHub Release Oficial
        if: steps.check_version.outputs.is_new_version == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "KiloMetrix v${{ env.VERSION }}"
          make_latest: true
          body: |
            ### 🚀 Nueva versión compilada y firmada
            - **Versión:** `v${{ env.VERSION }}`
            - **Commit:** `${{ github.sha }}`
            - APK firmado listo para instalar o actualizar sin conflictos.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}