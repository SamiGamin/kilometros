name: Compilar, Firmar y Publicar Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle y Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Permisos a gradlew
        run: chmod +x gradlew

      - name: 5. Restaurar google-services.json desde Secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: 6. Compilar y Firmar APK (Release)
        run: ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 7. Obtener Versión para el Tag
        id: get_version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "1.0.0")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION-build${{ github.run_number }}" >> $GITHUB_ENV

      - name: 8. Crear Tag y GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "KiloMetrix ${{ env.VERSION }} (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Nueva versión compilada y firmada
            - **Versión:** `${{ env.VERSION }}`
            - **Commit:** `${{ github.sha }}`
            - APK firmado listo para instalar/actualizar sin conflictos.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}