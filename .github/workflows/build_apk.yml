name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build:
    name: Compilar APK en línea
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle y Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 5. Compilar APK (Debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: 6. Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: KiloMetrix-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14