name: Compilar, Firmar y Publicar Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle y Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Permisos a gradlew
        run: chmod +x gradlew

      - name: 5. Restaurar archivos desde Secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GS_B64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > app/release.keystore

      - name: 5.1 Validar integridad
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Tamaño exacto del archivo en bytes:"
          wc -c app/release.keystore

          echo "Longitud en caracteres de la contraseña recibida:"
          echo -n "$KEYSTORE_PASSWORD" | wc -m

          echo "Validando lectura con keytool directo de ENV..."
          keytool -list -keystore app/release.keystore -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"

      - name: 6. Compilar y Firmar APK (Release)
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 7. Obtener Versión para el Tag
        id: get_version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "1.0.0")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: 8. Crear Tag y GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "KiloMetrix ${{ env.VERSION }}"
          make_latest: true
          body: |
            ### 🚀 Nueva versión compilada y firmada
            - **Versión:** `${{ env.VERSION }}`
            - **Commit:** `${{ github.sha }}`
            - APK firmado listo para instalar/actualizar sin conflictos.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}